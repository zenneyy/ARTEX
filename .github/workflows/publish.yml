
name: Build and Publish ARTEX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zenneyy/artex

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build:static

      - name: Prepare embedded frontend
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          test -f server/webui/dist/index.html

      - name: Compile Linux binaries
        run: |
          set -euo pipefail

          mkdir -p dist/amd64 dist/arm64

          for ARCH in amd64 arm64; do
            echo "Building Linux $ARCH"

            CGO_ENABLED=0 \
            GOOS=linux \
            GOARCH="$ARCH" \
            go build \
              -tags embedui \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/$ARCH/artex" \
              ./cmd/artex
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zenneyy/artex
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
